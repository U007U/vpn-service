# Edge-нода: точка подключения и только она.
#
# В отличие от центрального сервера, здесь НЕТ ничего, кроме VPN-движка:
# ни панели Marzban, ни базы данных, ни оплаты, ни Telegram-бота, ни админки.
# Конфиг xray спускает сюда центральная панель по защищённому каналу (mTLS, порт 62050) —
# поэтому ключи REALITY на ноде те же, что на главном сервере, и руками их не сводят.
#
# Этим файлом поднимается ОДНА нода. Запустите его дважды: на сервере №2 и на сервере №3.
# Подробно — по шагам — в NODES.md в корне репозитория.

name: marzban-node

services:
  marzban-node:
    # Версия ЗАФИКСИРОВАНА — тот же принцип, что у gozargah/marzban:v0.8.4 в основном compose.
    # `latest` запрещён: он сдвинется молча в день выхода новой версии и может поменять поведение.
    # Актуальная стабильная на момент написания: v0.5.2 (проверено 2026-07-31).
    image: gozargah/marzban-node:v0.5.2
    restart: unless-stopped

    environment:
      # Сертификат, который центральная панель показывает в дашборде (Node Settings → Show
      # Certificate). Это и есть контроль доступа: панель не пройдёт проверку mTLS на порту
      # управления, пока не предъявит этот сертификат. Файл кладётся руками — см. NODES.md.
      SSL_CLIENT_CERT_FILE: /var/lib/marzban-node/ssl_client_cert.pem
      SERVICE_PROTOCOL: rest
      # Дефолты апстрима. Маппинг 1:1 (порт хоста = порт контейнера) — без сюрпризов.
      SERVICE_PORT: '62050'
      XRAY_API_PORT: '62051'

    volumes:
      # Сертификат управления и то немногое, что нода хранит.
      - /var/lib/marzban-node:/var/lib/marzban-node
      # Сюда панель пишет xray_config.json — те же инбаунды и ключи REALITY, что на главном.
      - /var/lib/marzban:/var/lib/marzban

    ports:
      # REALITY для клиентов — публикуем 443 ради маскировки: трафик выглядит как обычный HTTPS.
      # Внутри контейнера xray слушает 8443 (тот же конфиг, что панель рендерит для главного сервера),
      # а Docker маппит внешний 443 на внутренний 8443. Итог: главный сервер отдаёт подключения на
      # 8443 (там 443 занят Caddy), а ноды — на 443. Подписка клиента будет нести РАЗНЫЕ порты, и это
      # нормально: для каждой ноды свой адрес+порт в одной ссылке. Главное — указать порт 443 для ноды
      # иначе подписка унаследует 8443 и клиенты не смогут подключиться к ноде (на 8443 там никто не слушает).
      - '443:8443'
      # Управление из центральной панели (mTLS). Должен быть открыт наружу — иначе панель не достучится.
      - '62050:62050'
      # 62051 (Xray API, внутренний gRPC) намеренно НЕ публикуется: он нужен только внутри контейнера.

    # Лог как в основном compose: json-file с ротацией, иначе диск заполняется молча.
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
